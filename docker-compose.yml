services:

  postgres:

    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  customer-service:

    build: .

    container_name: customer-service

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:

  postgres-data: